{% extends 'store/base.html' %}

{% block title %}Contact Us — SK Mart{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-14">
  <h1 class="text-2xl font-bold text-charcoal mb-2">Contact Us</h1>
  <p class="text-gray-500 mb-8">Questions about an order or a product? Our team replies within 24 hours.</p>

  <form method="post" class="dh-form-section space-y-4">
    {% csrf_token %}
    <div>
      <label class="dh-label">Name</label>
      <input type="text" name="name" required class="dh-input w-full">
    </div>
    <div>
      <label class="dh-label">Email</label>
      <input type="email" name="email" required class="dh-input w-full">
    </div>
    <div>
      <label class="dh-label">Message</label>
      <textarea name="message" rows="5" required class="dh-input w-full"></textarea>
    </div>
    <button type="submit" class="dh-btn-primary w-full py-3">Send Message</button>
  </form>
</div>
{% endblock %}
